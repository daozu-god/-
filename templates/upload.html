{% extends "base.html" %}

{% block content %}
<div class="card login-card">
    <h2 class="card-title">上传头像</h2>

    {% if error %}
        <div class="error-message">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('upload') }}" enctype="multipart/form-data" class="login-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="file">选择文件</label>
            <input type="file" id="file" name="file" class="form-input" required>
        </div>
        <button type="submit" class="btn btn-primary">上传</button>
    </form>

    {% if uploaded_url %}
        <div class="upload-success" style="margin-top: 20px; text-align: center;">
            <p style="color: #22c55e; font-weight: 600; margin-bottom: 12px;">✅ 上传成功</p>
            <img src="{{ uploaded_url }}" alt="头像预览" style="max-width: 200px; max-height: 200px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); margin-bottom: 12px;">
            <p style="word-break: break-all; font-size: 13px; color: #666;">
                <a href="{{ uploaded_url }}" target="_blank">{{ uploaded_url }}</a>
            </p>
        </div>
    {% endif %}

    <p style="margin-top: 20px; text-align: center;">
        <a href="{{ url_for('index') }}">返回首页</a>
    </p>
</div>
{% endblock %}
