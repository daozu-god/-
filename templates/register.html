{% extends "base.html" %}

{% block content %}
<div class="card login-card">
    <h2 class="card-title">用户注册</h2>
    {% if error %}
        <div class="error-message">{{ error }}</div>
    {% endif %}
    <form method="POST" action="{{ url_for('register') }}" class="login-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="username">用户名</label>
            <input type="text" id="username" name="username" class="form-input" placeholder="请输入用户名" maxlength="64" autocomplete="username" required>
        </div>
        <div class="form-group">
            <label for="password">密码</label>
            <input type="password" id="password" name="password" class="form-input" placeholder="请输入密码" minlength="12" maxlength="128" autocomplete="new-password" required>
        </div>
        <div class="form-group">
            <label for="email">邮箱</label>
            <input type="email" id="email" name="email" class="form-input" placeholder="请输入邮箱" maxlength="128" autocomplete="email">
        </div>
        <div class="form-group">
            <label for="phone">手机号</label>
            <input type="text" id="phone" name="phone" class="form-input" placeholder="请输入手机号" maxlength="32">
        </div>
        <button type="submit" class="btn btn-primary">注册</button>
    </form>
    <p class="card-text" style="margin-top:16px;text-align:center;">
        已有账号？<a href="{{ url_for('login') }}">立即登录</a>
    </p>
</div>
{% endblock %}
